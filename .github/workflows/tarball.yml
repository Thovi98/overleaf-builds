name: Build Overleaf tarball (multi-arch)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Overleaf commit"
        required: false
        default: ""
      arch:
        description: "CPU architecture (amd64,arm64)"
        required: true
        default: "amd64,arm64"

  schedule:
    - cron: '0 15 * * 5'


jobs:

  ##########################################################################
  # PREPARE
  ##########################################################################

  prepare:
    runs-on: ubuntu-latest

    outputs:
      commit:       ${{ steps.commit.outputs.commit }}
      short_commit: ${{ steps.commit.outputs.short_commit }}
      commit_date:  ${{ steps.commit_date.outputs.commit_date }}
      version:      ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check-version.outputs.should_build }}
      matrix_arch:  ${{ steps.matrix.outputs.matrix_arch }}

    steps:

      - name: Get latest commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          REQUESTED="${{ github.event.inputs.commit }}"

          if [ -n "$REQUESTED" ]; then
            COMMIT="$REQUESTED"
          else
            COMMIT=$(git ls-remote \
              https://github.com/overleaf/overleaf.git \
              HEAD \
              | cut -f1)
          fi

          SHORT_COMMIT="${COMMIT:0:7}"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=$SHORT_COMMIT" >> "$GITHUB_OUTPUT"

          echo "Overleaf commit: $COMMIT"
          echo "Short commit:    $SHORT_COMMIT"


      - name: Get commit date
        id: commit_date
        shell: bash
        run: |
          set -euo pipefail

          git init overleaf-meta
          cd overleaf-meta

          git remote add origin \
            https://github.com/overleaf/overleaf.git

          git fetch \
            --quiet \
            --depth=1 \
            origin "${{ steps.commit.outputs.commit }}"

          COMMIT_DATE=$(git show -s \
            --format='%cd' \
            --date=format:%Y%m%d \
            "${{ steps.commit.outputs.commit }}")

          echo "commit_date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"

          echo "Commit date: $COMMIT_DATE"


      - name: Define version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.commit_date.outputs.commit_date }}-${{ steps.commit.outputs.short_commit }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Build version: $VERSION"


      - name: Check if release already exists
        id: check-version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.version }}"

          if git ls-remote \
              --exit-code \
              --tags \
              "https://github.com/${{ github.repository }}.git" \
              "refs/tags/$TAG" \
              >/dev/null 2>&1; then

            echo "Release/tag $TAG already exists."
            echo "should_build=false" >> "$GITHUB_OUTPUT"

          else

            echo "Release/tag $TAG does not exist."
            echo "should_build=true" >> "$GITHUB_OUTPUT"

          fi


      - name: Build architecture matrix
        id: matrix
        if: steps.check-version.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARCH="${{ github.event.inputs.arch }}"
          else
            ARCH="amd64,arm64"
          fi

          MATRIX=$(echo "$ARCH" | jq -R -s -c '
            split(",")
            | map(gsub("^\\s+|\\s+$"; ""))
            | map(select(length > 0))
          ')

          echo "matrix_arch=$MATRIX" >> "$GITHUB_OUTPUT"

          echo "Architectures: $MATRIX"


  ##########################################################################
  # BUILD
  ##########################################################################

  build:
    needs: prepare

    if: needs.prepare.outputs.should_build == 'true'

    strategy:
      fail-fast: false

      matrix:
        arch: ${{ fromJson(needs.prepare.outputs.matrix_arch) }}

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    permissions:
      contents: read

    env:
      CI: 1
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

    steps:

      ########################################################################
      # DEPENDENCIES
      ########################################################################

      - name: Install system dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            ca-certificates \
            build-essential \
            python3 \
            pkg-config \
            jq \
            tar \
            gzip


      ########################################################################
      # SOURCE
      ########################################################################

      - name: Checkout Overleaf
        run: |
          set -euo pipefail

          git clone \
            --filter=blob:none \
            https://github.com/overleaf/overleaf.git \
            overleaf

          cd overleaf

          git checkout --detach \
            "${{ needs.prepare.outputs.commit }}"

          echo "Building Overleaf:"
          git log -1 --oneline


      ########################################################################
      # NODE
      ########################################################################

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24


      ########################################################################
      # COREPACK / YARN
      ########################################################################

      - name: Setup Corepack and Yarn
        working-directory: overleaf
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Node.js"
          echo "========================================"

          node --version
          npm --version


          echo
          echo "========================================"
          echo "Overleaf package manager"
          echo "========================================"

          PACKAGE_MANAGER=$(node -p \
            "require('./package.json').packageManager")

          echo "packageManager: $PACKAGE_MANAGER"


          echo
          echo "========================================"
          echo "Enable Corepack"
          echo "========================================"

          corepack enable


          echo
          echo "========================================"
          echo "Install project package manager"
          echo "========================================"

          corepack install


          echo
          echo "========================================"
          echo "Verify Yarn"
          echo "========================================"

          EXPECTED_YARN=$(node -p \
            "require('./package.json').packageManager.replace(/^yarn@/, '')")

          ACTUAL_YARN=$(yarn --version)
          YARN_PATH=$(command -v yarn)

          echo "Expected Yarn: $EXPECTED_YARN"
          echo "Actual Yarn:   $ACTUAL_YARN"
          echo "Yarn path:     $YARN_PATH"

          if [ "$ACTUAL_YARN" != "$EXPECTED_YARN" ]; then
            echo
            echo "ERROR: incorrect Yarn version!"
            echo "Expected: $EXPECTED_YARN"
            echo "Actual:   $ACTUAL_YARN"
            exit 1
          fi


          echo
          echo "========================================"
          echo "Yarn configuration"
          echo "========================================"

          echo "nodeLinker:"
          yarn config get nodeLinker

          echo
          echo "enableGlobalCache:"
          yarn config get enableGlobalCache

          echo
          echo "Yarn version:"
          yarn --version


      ########################################################################
      # BUILD ENVIRONMENT
      ########################################################################

      - name: Show build environment
        working-directory: overleaf
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build environment"
          echo "========================================"

          echo "Node:       $(node --version)"
          echo "npm:        $(npm --version)"
          echo "Yarn:       $(yarn --version)"
          echo "Yarn path:  $(command -v yarn)"
          echo "OS arch:    $(uname -m)"
          echo "Node arch:  $(node -p 'process.arch')"


      ########################################################################
      # VALIDATE PNP CONFIGURATION
      ########################################################################

      - name: Validate Yarn PnP configuration
        working-directory: overleaf
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Yarn PnP validation"
          echo "========================================"

          test -f .pnp.cjs
          test -f .yarnrc.yml
          test -f package.json
          test -f yarn.lock
          test -d .yarn

          NODE_LINKER=$(yarn config get nodeLinker)

          if [ "$NODE_LINKER" != "pnp" ]; then
            echo "ERROR: expected nodeLinker=pnp"
            echo "Actual: $NODE_LINKER"
            exit 1
          fi

          ENABLE_GLOBAL_CACHE=$(yarn config get enableGlobalCache)

          if [ "$ENABLE_GLOBAL_CACHE" != "false" ]; then
            echo "WARNING: enableGlobalCache is not false."
          fi

          echo
          echo "PnP files:"
          ls -lh .pnp.cjs .yarnrc.yml

          echo
          echo ".yarn contents:"
          find .yarn -maxdepth 2 -type f | sort | head -200


      ########################################################################
      # BUILD
      ########################################################################

      - name: Install Overleaf dependencies
        working-directory: overleaf
        run: |
          set -euo pipefail

          node server-ce/genScript install | bash


      - name: Compile Overleaf
        working-directory: overleaf
        run: |
          set -euo pipefail

          node server-ce/genScript compile | bash


      ########################################################################
      # VALIDATE BUILD
      ########################################################################

      - name: Validate PnP after build
        working-directory: overleaf
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Post-build PnP validation"
          echo "========================================"

          test -f .pnp.cjs
          test -d .yarn

          echo
          echo "Yarn:"
          yarn --version

          echo
          echo "PnP loader test:"

          node -e "
            require('./.pnp.cjs');
            console.log('Yarn PnP loader: OK');
          "


      ########################################################################
      # NATIVE ARTIFACTS
      ########################################################################

      - name: Inspect native artifacts
        working-directory: overleaf
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Native artifacts"
          echo "========================================"

          echo "Searching .yarn for native modules/binaries..."

          find .yarn \
            -type f \
            \( \
              -name '*.node' \
              -o -name '*.so' \
              -o -name '*.dylib' \
              -o -perm -111 \
            \) \
            -print \
            | head -200 || true


      ########################################################################
      # DISK USAGE
      ########################################################################

      - name: Show disk usage
        working-directory: overleaf
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Disk usage"
          echo "========================================"

          echo
          echo "Total:"
          du -sh .

          echo
          echo ".yarn:"
          du -sh .yarn

          echo
          echo "services:"
          du -sh services 2>/dev/null || true

          echo
          echo "libraries:"
          du -sh libraries 2>/dev/null || true

          echo
          echo "server-ce:"
          du -sh server-ce 2>/dev/null || true


      ########################################################################
      # PACKAGE
      ########################################################################

      - name: Prepare release directory
        run: |
          set -euo pipefail

          mkdir -p release

          # Copy the complete built working tree.
          # Yarn PnP requires .yarn + .pnp.cjs + project metadata.
          cp -a overleaf/. release/

          # Never ship GitHub/repository metadata.
          rm -rf release/.git
          rm -rf release/.github


      ########################################################################
      # TEST RELEASE DIRECTORY
      ########################################################################

      - name: Test release directory
        working-directory: release
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Testing packaged release"
          echo "========================================"

          echo "Node:"
          node --version

          echo
          echo "Yarn:"
          yarn --version

          echo
          echo "PnP loader:"
          node -e "
            require('./.pnp.cjs');
            console.log('Yarn PnP loader: OK');
          "

          echo
          echo "nodeLinker:"
          yarn config get nodeLinker


      ########################################################################
      # CREATE TARBALL
      ########################################################################

      - name: Create tarball
        run: |
          set -euo pipefail

          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.arch }}"

          TARBALL="overleaf-${VERSION}-${ARCH}.tar.gz"

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$TARBALL" \
            -C release .

          echo "Created:"
          ls -lh "$TARBALL"


      ########################################################################
      # ARTIFACT
      ########################################################################

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: overleaf-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          path: |
            overleaf-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.tar.gz
            overleaf-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 1


  ##########################################################################
  # RELEASE
  ##########################################################################

  release:
    needs:
      - prepare
      - build

    if: needs.prepare.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts


      - name: List release files
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Release files"
          echo "========================================"

          find artifacts \
            -maxdepth 3 \
            -type f \
            -print \
            | sort


      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: "Overleaf ${{ needs.prepare.outputs.version }}"
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz